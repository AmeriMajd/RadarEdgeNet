[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-edge-net"
version = "0.1.0"
description = "Reproducible multi-radar perception experiments on RadarScenes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Ameri Majd" }]
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26,<2.2",
  "scikit-learn>=1.5,<1.8",
]

[project.optional-dependencies]
train = [
  "imbalanced-learn>=0.13,<0.15",
  "joblib>=1.4,<2",
  "pandas>=2.2,<3",
]
dl = ["tensorflow>=2.19,<2.21"]
viz = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
radaredgenet-prepare = "radar_edge_net.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
